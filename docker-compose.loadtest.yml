# Load-testing override — adds a mock LLM provider and points backend/worker
# at it instead of the real Groq/Gemini APIs, so heavy load testing exercises
# SentinelAI's own capacity instead of the providers' free-tier rate limits.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d --build
#
# Then run load against it — see the "Load testing" section in README.md
# for the three scenarios (realistic mix, infra stress, automated failover).
version: '3.8'

services:
  mock-provider:
    build: ./backend
    command: uvicorn tests.mock_provider:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

  backend:
    environment:
      - GROQ_BASE_URL=http://mock-provider:9000/groq
      - GEMINI_BASE_URL=http://mock-provider:9000/gemini
      - GROQ_API_KEY=mock-key
      - GEMINI_API_KEY=mock-key
    depends_on:
      - mock-provider

  worker:
    environment:
      - GROQ_BASE_URL=http://mock-provider:9000/groq
      - GEMINI_BASE_URL=http://mock-provider:9000/gemini
    depends_on:
      - mock-provider
