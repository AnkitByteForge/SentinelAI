name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # GitHub-hosted runners have Docker available natively — that's all
    # tests/conftest.py needs, since it spins up its own Postgres+pgvector
    # via testcontainers and mocks Redis via fakeredis. No `services:`
    # block needed here; conftest.py overrides POSTGRES_URL itself before
    # any app module is imported.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: false
          tags: sentinelai-${{ matrix.component }}:ci
